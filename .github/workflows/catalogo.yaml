# Valida o catálogo e os scripts do self-service. No PR de sigla ou produto novo, é o
# que garante que o catálogo está bem formado e que os formulários foram regenerados.
name: catalogo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catálogo bem formado e formulários em dia
        run: python3 -I scripts/cli.py formularios --check
      - name: Testes dos scripts
        run: python3 -I -m unittest discover -s tests -t tests -v
