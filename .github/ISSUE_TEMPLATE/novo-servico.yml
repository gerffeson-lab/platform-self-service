# GERADO por scripts/cli.py formularios a partir do catálogo. Não edite à mão.
name: "Novo serviço"
description: "Cria um serviço a partir do golden path (repositório, esteira e padrões prontos)"
title: "[novo-servico] "
labels: ["novo-servico"]
body:
  - type: markdown
    attributes:
      value: |
        O pedido é validado assim que você envia. Se estiver tudo certo, o repositório é criado em
        poucos minutos e o link aparece nesta issue; se não, o bot explica o que corrigir.

        - **Quem pode pedir:** maintainers (tech leads) do time responsável.
        - **Nome do repositório:** `<sigla>-<produto>-<aplicação>`, montado a partir dos campos abaixo.
        - **Sigla ou produto que não aparece na lista:** é um PR em `catalogo/siglas.yaml`, revisado
          pela plataforma.
  - type: dropdown
    id: sigla-produto
    attributes:
      label: "Sigla e produto"
      description: "Sistema (sigla) e produto do catálogo"
      options:
        - "crt-credito"
    validations:
      required: true
  - type: input
    id: aplicacao
    attributes:
      label: "Nome da aplicação"
      description: "Minúsculas, números e hífen. O repositório será <sigla>-<produto>-<aplicação>"
      placeholder: "autorizador"
    validations:
      required: true
  - type: dropdown
    id: time
    attributes:
      label: "Time responsável"
      description: "Precisa ser um time do produto. Recebe acesso de escrita e vira CODEOWNER"
      options:
        - "pagamentos"
    validations:
      required: true
  - type: input
    id: work-item
    attributes:
      label: "Work item no Azure Boards"
      description: "Formato AB#<número>"
      placeholder: "AB#123"
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: "Descrição"
      description: "O que o serviço faz, em uma ou duas frases"
  - type: checkboxes
    id: confirmacao
    attributes:
      label: "Confirmação"
      options:
        - label: "O serviço segue o golden path (Java/Spring, contrato OpenAPI primeiro, esteira da plataforma)"
          required: true
